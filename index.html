<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js"></script> 
</head>
<body>
    <div class="calculator">
        <h2>Basic Calculator</h2>
        <input id="num1" type="number" placeholder="Enter first number">
        <input id="num2" type="number" placeholder="Enter second number">
        <button class="btn-reset" onclick="resetCalculator()">Clear</button>
        <div class="operators">
            <button id="btn-add">+</button>
            <button id="btn-subtract">−</button>
            <button id="btn-multiply">×</button>
            <button id="btn-divide">÷</button>
        </div>
        <div id="result">Result: 0</div>
    </div>
</body>
</html>
